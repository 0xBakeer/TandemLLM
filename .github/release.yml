# Categories of the release notes GitHub generates from merged pull requests, by label
# (docs/labels.md). A pull request goes into the first category whose label it carries.
changelog:
  exclude:
    labels: [skip-changelog, duplicate, invalid, wontfix]
  categories:
    - title: New models
      labels: [models/new, models/flint, models/qwen3.8, models/lfm2.5, models/nemotron, models/ornith]
    - title: Engine
      labels: [engine/core, engine/kernels, engine/drafting, engine/cache, perf]
    - title: Server and conductor
      labels: [server/api, server/conductor, server/proxy]
    - title: Chat
      labels: [chat]
    - title: Dashboard
      labels: [dash/setup, dash/chat, dash/usage, dash/performance, dash/dev, dash/playground, dash/conductor, dash/memory, dash/backends, dash/system]
    - title: Weights
      labels: [quant/exl3, quant/nvfp4, quant/bf16, quant/community]
    - title: Fixes
      labels: [bug]
    - title: Docs
      labels: [docs, docs/manual]
    - title: Other
      labels: ["*"]
