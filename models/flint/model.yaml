# Recursive Flint in TandemLLM: the setup guide's registry entry (docs/setup.md). Schema 1.
#
# Recursive's mixture-of-experts model for coding agents (engine/models/flint), from our EXL3 packs or the BF16
# checkpoint, drafting with the lookup cut by StairCut (the checkpoint has no draft layer). weights_gib: allocated
# at load (measured 2026-10-22). Window 262,144 tokens (131,072 for BF16); the 14 full layers keep 28,672 bytes a
# token, the 35 sliding layers a ring of 640 rows. Rows of the measured table come from real runs only.
schema: 1
id: flint
name: Recursive Flint
family: Flint
params: 39.8B, ~2.5B active a token
recommended: false
order: 8
pitch: Recursive's mixture-of-experts model for coding agents, from our EXL3 packs or the BF16 checkpoint.
architecture: '49 layers: 2 dense and 47 with a mixture of 256 experts of which 6 and a shared one run a token; grouped-query
  attention with a learned sink per head, 35 sliding-window layers (513 tokens) with rotary and 14 full layers without positional
  encoding. It decides on each turn whether to reason in a <think> block and calls tools in its own arg-key form.'
license: The model's license (Apache-2.0) is on its Hugging Face page. TandemLLM itself is AGPL-3.0 or commercial.
icon: null
links:
- label: Model card
  url: https://huggingface.co/RecursiveSI/flint
devices:
- id: dgx-spark
  label: NVIDIA DGX Spark (128 GB unified memory)
  total_gib: 121.63
  reserved_gib: 10.0
  note: The GPU and the CPU share this memory. MemTotal reads 121.6 GiB of the 128 GB.
assets:
- id: qwen3.5-2b
  label: Qwen3.5-2B (the narrator, and Wren)
  path: ${HOME}/.qwen38-spark-engine/models/qwen3.5-2b/config.json
  also: []
  fetchable: true
  protected: false
  hf_repo: Qwen/Qwen3.5-2B
  fetch:
  - repo: Qwen/Qwen3.5-2B
    files:
    - '*.json'
    - '*.safetensors'
    - '*.jinja'
    - merges.txt
    - LICENSE
    to: ${HOME}/.qwen38-spark-engine/models/qwen3.5-2b
    gb: 4.57
  source: Public on Hugging Face; install.sh --setup downloads it for Wren, the fetch step when the narrator is on (VIS-153).
- id: laya
  label: Laya decision models
  path: ${HOME}/.qwen38-spark-engine/deciders/laya/model.safetensors
  also: []
  fetchable: true
  protected: false
  hf_repo: convaiinnovations/laya
  fetch:
  - repo: convaiinnovations/laya
    files:
    - config.json
    - rl_agent_config.json
    - model.safetensors
    - encoder/*
    - tokenizer/*
    - multilingual/*
    - typed-decisions/*
    to: ${HOME}/.qwen38-spark-engine/deciders/laya
    gb: 2.35
  source: Public on Hugging Face (no token needed); the fetch step downloads its three models when Laya is on (VIS-153). Its
    Python files are not downloaded.
